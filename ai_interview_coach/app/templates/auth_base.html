<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>{% block title %}Prep — AI Interview Coach{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
  <nav class="navbar bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('home') }}">
        <span class="brand-mark">P</span> prep<span class="brand-period">.</span>
      </a>
      <a class="back-link" href="{{ url_for('home') }}">← Back to home</a>
    </div>
  </nav>
  <main class="auth-main container">
    <section class="auth-card">
      <div class="auth-mark">P</div>
      {% block content %}{% endblock %}
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="auth-messages" aria-live="polite">
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} py-2 mb-2" role="alert">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
    </section>
    <p class="auth-footnote">Prep · Build confidence, one answer at a time.</p>
  </main>
  <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
