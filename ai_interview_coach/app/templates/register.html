{% extends "auth_base.html" %}
{% block title %}Create account — Prep{% endblock %}
{% block content %}
  <div class="auth-eyebrow">GET STARTED</div>
  <h1>Create your account</h1>
  <p class="auth-subtitle">Save your practice progress and keep improving.</p>
  <form method="post" action="{{ url_for('register') }}" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label" for="full_name">Full name</label>
      <input class="form-control" id="full_name" name="full_name" type="text" autocomplete="name"
             maxlength="100" value="{{ full_name|default('') }}" placeholder="Your name" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="email">Email address</label>
      <input class="form-control" id="email" name="email" type="email" autocomplete="email"
             maxlength="254" value="{{ email|default('') }}" placeholder="you@example.com" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <div class="password-wrap">
        <input class="form-control" id="password" name="password" type="password" autocomplete="new-password"
               minlength="8" maxlength="128" placeholder="At least 8 characters" required>
        <button class="password-toggle" type="button" data-toggle-password="password" aria-label="Show password">Show</button>
      </div>
      <div class="form-text">Use at least 8 characters.</div>
    </div>
    <div class="mb-4">
      <label class="form-label" for="confirm_password">Confirm password</label>
      <input class="form-control" id="confirm_password" name="confirm_password" type="password"
             autocomplete="new-password" minlength="8" maxlength="128" placeholder="Enter your password again" required>
    </div>
    <button class="btn btn-primary w-100 auth-submit" type="submit">Create account</button>
  </form>
  <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
